<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Base Apparel coming soon page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<div class="container">
  <div class="text-section">
    <img class="logo" src="images/logo.svg" alt="logo">

    <h1 class="main">
      <span class="first-line">WE'RE</span><br>
      <span class="second-line">COMING</span><br>
      <span class="third-line">SOON</span>
    </h1>

    <p class="format">
      Hello fellow shoppers! We're currently building our new fashion store.
      Add your email below to stay up-to-date with announcements and our launch deals.
    </p>

    <div class="email-wrapper">
      <input type="email" placeholder="Email Address" class="email-input">
      <img class="error-btn" src="images/icon-error.svg" alt="error icon">
      <button class="email-btn">
        <img src="images/icon-arrow.svg" alt="submitbutton">
      </button>
    </div>
    <p class="error-text"></p>
  </div>

  <div class="image-section">
    <img class="hero" src="images/hero-desktop.jpg" alt="hero image">
  </div>
</div>
    <script src="script.js"></script>
   
</body>
</html>
